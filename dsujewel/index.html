<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>보석 맞추기</title>
<style>
  :root { --bg:#07070d; --panel:#12121e; --text:#f3f3f8; --muted:#9a9ab0; --accent:#ffcc33; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  body { display:flex; justify-content:center; align-items:flex-start; padding:16px; touch-action:none; user-select:none; -webkit-user-select:none; }
  .wrap { width:100%; max-width:520px; }
  h1 { margin:4px 0 12px; font-size:26px; text-align:center; letter-spacing:1px;
    background:linear-gradient(90deg,#ff4d6d,#ffcc33,#3ddc84,#4d8dff,#c86bff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hud { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .stat { background:var(--panel); border-radius:12px; padding:8px 10px; text-align:center; }
  .stat .k { font-size:12px; color:var(--muted); }
  .stat .v { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .board { position:relative; border-radius:14px; overflow:hidden; background:#000; box-shadow:0 0 0 2px #1d1d2e, 0 10px 40px rgba(0,0,0,.6); }
  canvas { display:block; touch-action:none; }
  .btns { display:flex; gap:8px; margin-top:12px; }
  button { flex:1; padding:12px; border:0; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer;
    background:var(--panel); color:var(--text); }
  button.primary { background:var(--accent); color:#222; }
  button:active { transform:scale(.97); }
  .help { margin-top:12px; padding:10px 12px; background:var(--panel); border-radius:12px; font-size:13px; line-height:1.7; color:var(--muted); text-align:center; }
  .help b { color:var(--accent); }
  .overlay { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    background:rgba(0,0,0,.75); text-align:center; }
  .overlay.show { display:flex; }
  .overlay h2 { margin:0; font-size:30px; }
  .overlay p { margin:0; font-size:18px; color:var(--muted); }
  .overlay button { flex:none; padding:12px 28px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>💎 보석 맞추기</h1>
  <div class="hud">
    <div class="stat"><div class="k">점수</div><div class="v" id="score">0</div></div>
    <div class="stat"><div class="k">남은 이동</div><div class="v" id="moves">30</div></div>
    <div class="stat"><div class="k">최고 점수</div><div class="v" id="best">0</div></div>
  </div>
  <div class="board" id="boardWrap">
    <canvas id="cv"></canvas>
    <div class="overlay" id="over">
      <h2>게임 종료!</h2>
      <p id="finalText"></p>
      <button class="primary" id="againBtn">다시 하기</button>
    </div>
  </div>
  <div class="btns">
    <button id="hintBtn">💡 힌트</button>
    <button class="primary" id="newBtn">새 게임</button>
  </div>
  <div class="help">
    <b>콤보 3회 이상</b>이면 아이템이 랜덤으로 생겨요!<br>
    ↔ 가로 한줄 · ↕ 세로 한줄 · 🔥 3×3 폭탄 — 같이 맞추면 발동<br>
    🌈 무지개 — 아무 보석과 바꾸면 그 색 보석을 모두 없애요
  </div>
</div>

<script>
(() => {
  const N = 8, MOVES = 30;
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const wrapEl = document.getElementById('boardWrap');
  const $score = document.getElementById('score'), $moves = document.getElementById('moves'), $best = document.getElementById('best');

  // ---------- 보석 정의 ----------
  const poly = (n, rot, sx = 1, sy = 1) => Array.from({ length: n }, (_, i) => {
    const a = rot + i * 2 * Math.PI / n; return [Math.cos(a) * sx, Math.sin(a) * sy];
  });
  const GEMS = [
    { name: 'red',    color: '#e8262f', pts: [[0,-.98],[.98,0],[0,.98],[-.98,0]], inner: .5 },
    { name: 'green',  color: '#2cc23a', pts: [[0,-1],[.98,.78],[-.98,.78]], inner: .42 },
    { name: 'blue',   color: '#2f74ec', pts: [[-.55,-.78],[.55,-.78],[.98,-.28],[0,.98],[-.98,-.28]], inner: .5 },
    { name: 'pink',   color: '#e256c2', pts: poly(8, Math.PI / 8, .97, .97), inner: .55 },
    { name: 'yellow', color: '#f7b512', pts: poly(6, 0, .98, .9), inner: .55 },
    { name: 'purple', color: '#a64ff5', pts: poly(10, Math.PI / 10, .95, .95), inner: .55 },
  ];
  const T = GEMS.length;

  const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (hex, to, t) => { const a = hex2rgb(hex); return `rgb(${a.map((v, i) => Math.round(v + (to[i] - v) * t)).join(',')})`; };
  const shade = (hex, d) => d >= 0 ? mix(hex, [255, 255, 255], d) : mix(hex, [0, 0, 0], -d);

  function renderGem(def, size) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d');
    const R = size * 0.44, cx = size / 2, cy = size / 2;
    const outer = def.pts.map(([x, y]) => [cx + x * R, cy + y * R]);
    const mx = outer.reduce((s, p) => s + p[0], 0) / outer.length;
    const my = outer.reduce((s, p) => s + p[1], 0) / outer.length;
    const inner = outer.map(([x, y]) => [mx + (x - mx) * def.inner, my + (y - my) * def.inner]);
    const L = [-0.6, -0.8];
    const path = pts => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); };

    // 그림자
    g.save(); g.translate(0, size * 0.03); path(outer); g.fillStyle = 'rgba(0,0,0,.5)'; g.fill(); g.restore();

    // 측면 면(facet)
    for (let i = 0; i < outer.length; i++) {
      const j = (i + 1) % outer.length;
      const ex = (outer[i][0] + outer[j][0]) / 2 - mx, ey = (outer[i][1] + outer[j][1]) / 2 - my;
      const len = Math.hypot(ex, ey) || 1;
      const d = (ex / len) * L[0] + (ey / len) * L[1];
      path([outer[i], outer[j], inner[j], inner[i]]);
      g.fillStyle = shade(def.color, d * 0.5);
      g.fill();
    }
    // 윗면(table)
    path(inner);
    const grd = g.createLinearGradient(inner[0][0] - R, my - R * .5, mx + R * .5, my + R * .5);
    grd.addColorStop(0, shade(def.color, 0.35));
    grd.addColorStop(1, shade(def.color, -0.05));
    g.fillStyle = grd; g.fill();

    // 면 경계선
    g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = Math.max(1, size * 0.01);
    for (let i = 0; i < outer.length; i++) { g.beginPath(); g.moveTo(...outer[i]); g.lineTo(...inner[i]); g.stroke(); }
    path(inner); g.stroke();

    // 외곽선
    path(outer); g.lineJoin = 'round';
    g.strokeStyle = shade(def.color, -0.65); g.lineWidth = size * 0.035; g.stroke();

    // 반짝임
    g.save(); path(inner); g.clip();
    g.fillStyle = 'rgba(255,255,255,.55)';
    g.beginPath(); g.ellipse(mx - R * .18, my - R * .2, R * .16, R * .08, -0.6, 0, Math.PI * 2); g.fill();
    g.restore();
    g.fillStyle = 'rgba(255,255,255,.9)';
    g.beginPath(); g.arc(outer[0][0] * .2 + mx * .8 - R * .25, my - R * .45, size * 0.018, 0, Math.PI * 2); g.fill();
    return c;
  }

  // 무지개 보석 (같은 보석 모두 없애기 아이템)
  function renderRainbow(size) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'), m = size / 2, R = size * 0.38;
    g.beginPath(); g.arc(m, m + size * 0.03, R, 0, Math.PI * 2); g.fillStyle = 'rgba(0,0,0,.5)'; g.fill();
    const cg = g.createConicGradient(0, m, m);
    ['#ff3b3b', '#ffb020', '#ffe94d', '#3ddc5a', '#3d8bff', '#b44dff', '#ff3b3b'].forEach((col, i, a) => cg.addColorStop(i / (a.length - 1), col));
    g.beginPath(); g.arc(m, m, R, 0, Math.PI * 2); g.fillStyle = cg; g.fill();
    const rg = g.createRadialGradient(m - R * .3, m - R * .3, R * .1, m, m, R);
    rg.addColorStop(0, 'rgba(255,255,255,.85)'); rg.addColorStop(.5, 'rgba(255,255,255,.1)'); rg.addColorStop(1, 'rgba(0,0,0,.35)');
    g.fillStyle = rg; g.fill();
    g.lineWidth = size * 0.035; g.strokeStyle = '#1a1030'; g.stroke();
    // 가운데 별
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? R * .2 : R * .45;
      g.lineTo(m + Math.cos(a) * rr, m + Math.sin(a) * rr);
    }
    g.closePath(); g.fillStyle = '#fff'; g.shadowColor = '#fff'; g.shadowBlur = size * 0.1; g.fill();
    return c;
  }

  const ITEMS = ['row', 'col', 'bomb', 'rainbow'];
  const ITEM_NAMES = { row: '가로 한줄 깨기', col: '세로 한줄 깨기', bomb: '3×3 폭탄', rainbow: '같은 보석 모두 없애기' };
  const gemColor = t => t < T ? GEMS[t].color : '#ffffff';

  // ---------- 상태 ----------
  let S = 60, dpr = 1, gemImgs = [];
  let board, score, moves, combo, state, selected, dying, particles, floats, beams, hint, idleTime, drag;
  let best = 0;
  try { best = +localStorage.getItem('jewel-best') || 0; } catch (e) {}
  $best.textContent = best;

  const rand = () => Math.floor(Math.random() * T);
  const newGem = (t, r, c) => ({ t, x: c, y: r, v: 0 });

  function typeAt(r, c) { return r >= 0 && r < N && c >= 0 && c < N && board[r][c] ? board[r][c].t : -1; }

  function makesMatch(r, c) {
    const t = typeAt(r, c); if (t < 0) return false;
    let h = 1, v = 1;
    for (let k = c - 1; typeAt(r, k) === t; k--) h++;
    for (let k = c + 1; typeAt(r, k) === t; k++) h++;
    for (let k = r - 1; typeAt(k, c) === t; k--) v++;
    for (let k = r + 1; typeAt(k, c) === t; k++) v++;
    return h >= 3 || v >= 3;
  }

  function findMatches() {
    const set = new Set();
    for (let r = 0; r < N; r++) for (let c = 0; c < N; ) {
      const t = typeAt(r, c); let e = c + 1;
      while (e < N && typeAt(r, e) === t) e++;
      if (t >= 0 && e - c >= 3) for (let k = c; k < e; k++) set.add(r * N + k);
      c = e;
    }
    for (let c = 0; c < N; c++) for (let r = 0; r < N; ) {
      const t = typeAt(r, c); let e = r + 1;
      while (e < N && typeAt(e, c) === t) e++;
      if (t >= 0 && e - r >= 3) for (let k = r; k < e; k++) set.add(k * N + c);
      r = e;
    }
    return set;
  }

  function swapCells(a, b) {
    const tmp = board[a.r][a.c]; board[a.r][a.c] = board[b.r][b.c]; board[b.r][b.c] = tmp;
  }

  function findMove() {
    // 무지개 보석은 아무 이웃과 바꿔도 발동
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (board[r][c] && board[r][c].sp === 'rainbow') return [{ r, c }, c + 1 < N ? { r, c: c + 1 } : { r, c: c - 1 }];
    }
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const a = { r, c }, b = { r: r + dr, c: c + dc };
        if (b.r >= N || b.c >= N) continue;
        swapCells(a, b);
        const ok = makesMatch(a.r, a.c) || makesMatch(b.r, b.c);
        swapCells(a, b);
        if (ok) return [a, b];
      }
    }
    return null;
  }

  function fillNoMatches() {
    do {
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        let t; do { t = rand(); } while (
          (c >= 2 && board[r][c - 1].t === t && board[r][c - 2].t === t) ||
          (r >= 2 && board[r - 1][c].t === t && board[r - 2][c].t === t));
        board[r][c] = newGem(t, r, c);
      }
    } while (!findMove());
  }

  function newGame() {
    board = Array.from({ length: N }, () => Array(N).fill(null));
    fillNoMatches();
    // 시작 시 위에서 떨어지는 연출
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) board[r][c].y = r - N - 1 - c * 0.15;
    score = 0; moves = MOVES; combo = 0; state = 'fall'; selected = null;
    dying = []; particles = []; floats = []; beams = []; hint = null; idleTime = 0; drag = null;
    document.getElementById('over').classList.remove('show');
    updateHud();
  }

  function shuffle() {
    const gems = board.flat();
    do {
      for (let i = gems.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [gems[i], gems[j]] = [gems[j], gems[i]]; }
      gems.forEach((g, i) => board[Math.floor(i / N)][i % N] = g);
    } while (findMatches().size || !findMove());
    floats.push({ x: N / 2, y: N / 2, text: '섞는 중!', life: 1 });
    state = 'fall';
  }

  function updateHud() {
    $score.textContent = score; $moves.textContent = moves;
    if (score > best) { best = score; $best.textContent = best; try { localStorage.setItem('jewel-best', best); } catch (e) {} }
  }

  // ---------- 진행 ----------
  function trySwap(a, b) {
    if (state !== 'idle' || moves <= 0) return;
    if (Math.abs(a.r - b.r) + Math.abs(a.c - b.c) !== 1) return;
    selected = null; hint = null; idleTime = 0;
    swapCells(a, b);
    board[a.r][a.c].v = board[b.r][b.c].v = 0.006;
    state = 'swap'; lastSwap = [a, b];
  }
  let lastSwap = null;

  // 아이템이 지우는 칸 목록
  function itemCells(g, r, c) {
    const out = [];
    if (g.sp === 'row') for (let k = 0; k < N; k++) out.push(r * N + k);
    else if (g.sp === 'col') for (let k = 0; k < N; k++) out.push(k * N + c);
    else if (g.sp === 'bomb') {
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < N && cc >= 0 && cc < N) out.push(rr * N + cc);
      }
    } else if (g.sp === 'rainbow') {
      let t = g.target;
      if (t == null) { // 다른 아이템에 휘말리면 아무 색이나 하나
        const pool = board.flat().filter(x => x && x.t < T);
        t = pool.length ? pool[Math.floor(Math.random() * pool.length)].t : 0;
      }
      for (let rr = 0; rr < N; rr++) for (let cc = 0; cc < N; cc++)
        if (board[rr][cc] && board[rr][cc].t === t) out.push(rr * N + cc);
    }
    return out;
  }

  function clearMatches(set) {
    combo++;
    // 지워지는 칸에 아이템이 있으면 발동 (연쇄 발동 포함)
    const queue = [...set];
    while (queue.length) {
      const k = queue.pop(), r = Math.floor(k / N), c = k % N, g = board[r][c];
      if (!g || !g.sp || g.fired) continue;
      g.fired = true;
      beams.push({ sp: g.sp, r, c, life: 1, color: gemColor(g.t) });
      for (const k2 of itemCells(g, r, c)) if (!set.has(k2)) { set.add(k2); queue.push(k2); }
    }
    // 콤보 3회 이상이면 지워질 보석 하나를 랜덤 아이템으로 바꿔 남김
    let item = null;
    if (combo >= 3) {
      const cand = [...set].filter(k => { const g = board[Math.floor(k / N)][k % N]; return g && !g.sp; });
      if (cand.length) {
        const k = cand[Math.floor(Math.random() * cand.length)];
        set.delete(k);
        const g = board[Math.floor(k / N)][k % N];
        g.sp = ITEMS[Math.floor(Math.random() * ITEMS.length)];
        if (g.sp === 'rainbow') g.t = T;
        g.pop = 1;
        item = { sp: g.sp, x: k % N + .5, y: Math.floor(k / N) + .5 };
      }
    }
    const n = set.size + (item ? 1 : 0);
    const gained = n * 10 * combo + Math.max(0, n - 3) * 20;
    score += gained;
    let sx = 0, sy = 0;
    set.forEach(k => {
      const r = Math.floor(k / N), c = k % N, g = board[r][c];
      sx += c; sy += r;
      dying.push({ t: g.t, x: g.x, y: g.y, s: 1 });
      for (let i = 0; i < 8; i++) {
        const a = Math.random() * Math.PI * 2, sp = 0.002 + Math.random() * 0.006;
        particles.push({ x: c + .5, y: r + .5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color: gemColor(g.t) });
      }
      board[r][c] = null;
    });
    const cnt = Math.max(1, set.size);
    floats.push({ x: sx / cnt + .5, y: sy / cnt + .5, text: (combo > 1 ? `콤보 x${combo}  ` : '') + `+${gained}`, life: 1 });
    if (item) floats.push({ x: N / 2, y: Math.min(N - 1, Math.max(1, item.y)), text: `✨ ${ITEM_NAMES[item.sp]}!`, life: 1.4, color: '#7ff3ff', size: 0.32 });
    state = 'clear';
    updateHud();
  }

  function collapse() {
    for (let c = 0; c < N; c++) {
      let w = N - 1;
      for (let r = N - 1; r >= 0; r--) if (board[r][c]) {
        if (r !== w) { board[w][c] = board[r][c]; board[r][c] = null; }
        w--;
      }
      const empty = w + 1;
      for (let r = w; r >= 0; r--) {
        // 콤보가 잘 나도록: 새 보석이 아래/옆 보석 색을 따라갈 확률을 높임
        let t = rand();
        const below = board[r + 1] && board[r + 1][c], left = c > 0 && board[r][c - 1];
        const p = Math.random();
        if (p < 0.22 && below && below.t < T) t = below.t;
        else if (p < 0.4 && left && left.t < T) t = left.t;
        board[r][c] = newGem(t, r - empty - 0.3, c);
      }
    }
  }

  function settled() {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const g = board[r][c]; if (g && (g.x !== c || g.y !== r)) return false;
    }
    return true;
  }

  function update(dt) {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const g = board[r][c]; if (!g) continue;
      const dx = c - g.x, dy = r - g.y, dist = Math.hypot(dx, dy);
      if (g.pop) g.pop = Math.max(0, g.pop - dt / 450);
      if (dist === 0) { g.v = 0; continue; }
      g.v = Math.min(g.v + 0.00008 * dt, 0.03);
      const step = g.v * dt;
      if (step >= dist) { g.x = c; g.y = r; g.v = 0; }
      else { g.x += dx / dist * step; g.y += dy / dist * step; }
    }
    dying.forEach(d => d.s -= dt / 180);
    dying = dying.filter(d => d.s > 0);
    particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.00002 * dt; p.life -= dt / 600; });
    particles = particles.filter(p => p.life > 0);
    floats.forEach(f => { f.y -= dt * 0.0008; f.life -= dt / 1100; });
    floats = floats.filter(f => f.life > 0);
    beams.forEach(b => b.life -= dt / 380);
    beams = beams.filter(b => b.life > 0);

    if (state === 'swap' && settled()) {
      const [a, b] = lastSwap, ga = board[a.r][a.c], gb = board[b.r][b.c];
      if (ga.sp === 'rainbow' || gb.sp === 'rainbow') {
        // 무지개 보석: 바꾼 보석과 같은 색을 모두 없앰 (무지개+무지개는 전체)
        moves--; combo = 0;
        const set = new Set();
        if (ga.sp === 'rainbow' && gb.sp === 'rainbow') for (let k = 0; k < N * N; k++) set.add(k);
        else {
          const [rb, cell, other] = ga.sp === 'rainbow' ? [ga, a, gb] : [gb, b, ga];
          rb.target = other.t; set.add(cell.r * N + cell.c);
        }
        clearMatches(set);
      } else {
        const m = findMatches();
        if (m.size) { moves--; combo = 0; clearMatches(m); }
        else { swapCells(a, b); state = 'swapback'; }
      }
    } else if (state === 'swapback' && settled()) {
      state = 'idle';
    } else if (state === 'clear' && dying.length === 0) {
      collapse(); state = 'fall';
    } else if (state === 'fall' && settled()) {
      const m = findMatches();
      if (m.size) clearMatches(m);
      else {
        combo = 0; state = 'idle'; idleTime = 0;
        if (moves <= 0) gameOver();
        else if (!findMove()) shuffle();
      }
    }
    if (state === 'idle') {
      idleTime += dt;
      if (idleTime > 6000 && !hint) hint = findMove();
    }
  }

  function gameOver() {
    state = 'over';
    updateHud();
    document.getElementById('finalText').textContent = `최종 점수: ${score}점` + (score >= best && score > 0 ? ' 🏆 신기록!' : '');
    document.getElementById('over').classList.add('show');
  }

  // ---------- 그리기 ----------
  function draw(time) {
    const W = N * S;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, W);
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      ctx.fillStyle = (r + c) % 2 ? '#0c0c16' : '#11111d';
      ctx.fillRect(c * S, r * S, S, S);
    }
    const cellHL = (cell, color, lw) => {
      ctx.strokeStyle = color; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.roundRect(cell.c * S + 3, cell.r * S + 3, S - 6, S - 6, S * 0.18); ctx.stroke();
    };
    if (selected) {
      ctx.fillStyle = 'rgba(255,255,255,.12)';
      ctx.beginPath(); ctx.roundRect(selected.c * S + 3, selected.r * S + 3, S - 6, S - 6, S * 0.18); ctx.fill();
      cellHL(selected, 'rgba(255,255,255,.8)', 2);
    }
    if (hint && state === 'idle') {
      const a = 0.4 + 0.4 * Math.sin(time / 180);
      hint.forEach(h => cellHL(h, `rgba(255,220,80,${a})`, 3));
    }

    const drawGem = (t, x, y, s) => {
      const sz = S * s;
      ctx.drawImage(gemImgs[t], x * S + (S - sz) / 2, y * S + (S - sz) / 2, sz, sz);
    };
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const g = board[r][c]; if (!g) continue;
      let s = 1;
      if (selected && selected.r === r && selected.c === c) s = 1.06 + 0.04 * Math.sin(time / 120);
      if (g.pop) s *= 1 + 0.45 * Math.sin(g.pop * Math.PI);
      const px = (g.x + .5) * S, py = (g.y + .5) * S, pulse = 0.5 + 0.5 * Math.sin(time / 160);
      if (g.sp === 'bomb' || g.sp === 'rainbow') { // 뒤쪽 후광
        const halo = ctx.createRadialGradient(px, py, S * .15, px, py, S * .55);
        halo.addColorStop(0, g.sp === 'bomb' ? `rgba(255,150,40,${.5 + .3 * pulse})` : `rgba(255,255,255,${.4 + .3 * pulse})`);
        halo.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = halo; ctx.fillRect(px - S * .6, py - S * .6, S * 1.2, S * 1.2);
      }
      drawGem(g.t, g.x, g.y, s);
      if (g.sp === 'row' || g.sp === 'col') { // 줄무늬 + 화살표
        ctx.save(); ctx.translate(px, py); if (g.sp === 'col') ctx.rotate(Math.PI / 2);
        ctx.shadowColor = '#fff'; ctx.shadowBlur = S * .2;
        ctx.fillStyle = `rgba(255,255,255,${.7 + .3 * pulse})`;
        ctx.fillRect(-S * .32, -S * .13, S * .64, S * .07);
        ctx.fillRect(-S * .32, S * .06, S * .64, S * .07);
        for (const d of [-1, 1]) {
          ctx.beginPath(); ctx.moveTo(d * S * .47, 0); ctx.lineTo(d * S * .34, -S * .1); ctx.lineTo(d * S * .34, S * .1); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      } else if (g.sp === 'bomb') { // 깜빡이는 테두리
        ctx.save(); ctx.strokeStyle = `rgba(255,210,90,${.6 + .4 * pulse})`; ctx.lineWidth = 2.5;
        ctx.shadowColor = '#ff9a2a'; ctx.shadowBlur = S * .25;
        ctx.beginPath(); ctx.roundRect(px - S * .44, py - S * .44, S * .88, S * .88, S * .2); ctx.stroke();
        ctx.restore();
      }
    }
    // 아이템 발동 이펙트
    ctx.globalCompositeOperation = 'lighter';
    beams.forEach(b => {
      ctx.globalAlpha = b.life; ctx.fillStyle = b.color;
      ctx.shadowColor = b.color; ctx.shadowBlur = S * .5;
      const th = S * (0.25 + 0.5 * b.life);
      if (b.sp === 'row') ctx.fillRect(0, (b.r + .5) * S - th / 2, W, th);
      else if (b.sp === 'col') ctx.fillRect((b.c + .5) * S - th / 2, 0, th, W);
      else if (b.sp === 'bomb') ctx.fillRect((b.c - 1) * S, (b.r - 1) * S, S * 3, S * 3);
      else { ctx.globalAlpha = b.life * .45; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, W); }
    });
    ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    dying.forEach(d => { ctx.globalAlpha = Math.max(0, d.s); drawGem(d.t, d.x, d.y, 1 + (1 - d.s) * 0.4); });
    ctx.globalAlpha = 1;

    ctx.globalCompositeOperation = 'lighter';
    particles.forEach(p => {
      ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x * S, p.y * S, S * 0.06 * p.life + 1, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    floats.forEach(f => {
      ctx.font = `800 ${Math.round(S * (f.size || 0.42))}px -apple-system, sans-serif`;
      ctx.globalAlpha = Math.min(1, f.life * 2);
      ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(f.text, f.x * S, f.y * S);
      ctx.fillStyle = f.color || '#ffe066'; ctx.fillText(f.text, f.x * S, f.y * S);
    });
    ctx.globalAlpha = 1;
  }

  // ---------- 크기 조정 ----------
  function resize() {
    dpr = window.devicePixelRatio || 1;
    const avail = wrapEl.parentElement.clientWidth || Math.min(520, window.innerWidth - 32);
    S = Math.max(32, Math.floor(avail / N));
    cv.style.width = cv.style.height = N * S + 'px';
    cv.width = cv.height = Math.round(N * S * dpr);
    gemImgs = [...GEMS.map(d => renderGem(d, Math.round(S * dpr))), renderRainbow(Math.round(S * dpr))];
    wrapEl.style.width = N * S + 'px'; wrapEl.style.margin = '0 auto';
  }
  window.addEventListener('resize', resize);

  // ---------- 입력 ----------
  function cellFromEvent(e) {
    const rect = cv.getBoundingClientRect();
    const x = (e.clientX - rect.left) / S, y = (e.clientY - rect.top) / S;
    return { r: Math.floor(y), c: Math.floor(x), x, y };
  }
  cv.addEventListener('pointerdown', e => {
    if (state !== 'idle') return;
    const p = cellFromEvent(e);
    if (p.r < 0 || p.r >= N || p.c < 0 || p.c >= N) return;
    cv.setPointerCapture(e.pointerId);
    drag = { r: p.r, c: p.c, x: p.x, y: p.y, moved: false };
  });
  cv.addEventListener('pointermove', e => {
    if (!drag || drag.moved) return;
    const p = cellFromEvent(e), dx = p.x - drag.x, dy = p.y - drag.y;
    if (Math.hypot(dx, dy) < 0.35) return;
    drag.moved = true;
    const b = Math.abs(dx) > Math.abs(dy) ? { r: drag.r, c: drag.c + Math.sign(dx) } : { r: drag.r + Math.sign(dy), c: drag.c };
    if (b.r >= 0 && b.r < N && b.c >= 0 && b.c < N) trySwap({ r: drag.r, c: drag.c }, b);
  });
  cv.addEventListener('pointerup', () => {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.moved || state !== 'idle') return;
    const cell = { r: d.r, c: d.c };
    if (selected && selected.r === cell.r && selected.c === cell.c) selected = null;
    else if (selected && Math.abs(selected.r - cell.r) + Math.abs(selected.c - cell.c) === 1) trySwap(selected, cell);
    else selected = cell;
  });

  document.getElementById('hintBtn').onclick = () => { if (state === 'idle') hint = findMove(); };
  document.getElementById('newBtn').onclick = newGame;
  document.getElementById('againBtn').onclick = newGame;

  // ---------- 시작 ----------
  resize();
  newGame();
  let last = performance.now();
  function loop(t) {
    const dt = Math.min(t - last, 50); last = t;
    update(dt); draw(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
